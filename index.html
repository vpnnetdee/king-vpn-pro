<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามเพจของเรา</title>
    <!-- Font Awesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts สำหรับฟอนต์สวยๆ -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Prompt:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-10px);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #1877f2, #ff9a00, #ff0055);
        }
        
        h1 {
            font-family: 'Prompt', sans-serif;
            margin-bottom: 30px;
            color: #222;
            font-size: 28px;
            font-weight: 600;
            position: relative;
            display: inline-block;
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(to right, #1877f2, #ff0055);
            border-radius: 2px;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        
        a.button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 24px;
            border-radius: 12px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        a.button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        a.button:active {
            transform: translateY(0);
        }
        
        .button i {
            font-size: 24px;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }
        
        .button .button-text {
            flex-grow: 1;
            text-align: center;
        }
        
        .facebook { 
            background: linear-gradient(135deg, #1877f2, #0d5cb6);
            border-left: 5px solid #0d5cb6;
        }
        
        .facebook:hover {
            background: linear-gradient(135deg, #0d5cb6, #1877f2);
        }
        
        .premium { 
            background: linear-gradient(135deg, #ff9a00, #ff5e00, #ff0055);
            border-left: 5px solid #ff0055;
            position: relative;
        }
        
        .premium:hover {
            background: linear-gradient(135deg, #ff0055, #ff5e00, #ff9a00);
        }
        
        .premium::after {
            content: 'พิเศษ!';
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff0055;
            color: white;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
            transform: rotate(15deg);
            box-shadow: 0 3px 8px rgba(255, 0, 85, 0.5);
        }
        
        .social-icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            line-height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            margin: 0 10px 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            font-size: 28px;
            color: #333;
            transition: all 0.3s ease;
        }
        
        .social-icon:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .icon-facebook {
            color: #1877f2;
        }
        
        .icon-premium {
            color: #ff5e00;
            background: linear-gradient(135deg, rgba(255, 154, 0, 0.1), rgba(255, 94, 0, 0.1), rgba(255, 0, 85, 0.1));
        }
        
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #666;
            font-weight: 300;
        }
        
        /* Animation สำหรับไอคอน */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .social-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        .icon-premium {
            animation-delay: 0.5s;
        }
        
        /* เอฟเฟกต์พิเศษสำหรับไอคอนโปรเสริม */
        @keyframes shine {
            0% { background-position: -100px; }
            100% { background-position: 200px; }
        }
        
        .icon-premium i {
            background: linear-gradient(90deg, #ff9a00, #ffeb3b, #ff9a00);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s infinite linear;
        }
        
        /* Responsive design */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            a.button {
                padding: 14px 20px;
                font-size: 16px;
            }
            
            .social-icon {
                width: 50px;
                height: 50px;
                line-height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>ติดตามเราที่</h1>
    
    <div class="social-icons">
        <div class="social-icon icon-facebook">
            <i class="fab fa-facebook-f"></i>
        </div>
        <div class="social-icon icon-premium">
            <i class="fas fa-crown"></i>
        </div>
    </div>

    <div class="button-container">
        <!-- เปลี่ยนลิงก์เป็นเพจของคุณ -->
        <a class="button facebook" href="https://www.facebook.com/share/1CCYMGcdEg/" target="_blank">
            <i class="fab fa-facebook-f"></i>
            <span class="button-text">ติดตามเพจ Facebook</span>
        </a>

        <a class="button premium" href="https://dnstt.site" target="_blank">
            <i class="fas fa-crown"></i>
            <span class="button-text">โปรเสริมที่ใช้คู่กับ VPN</span>
        </a>
        
        <!-- ปุ่มเพิ่มเติมถ้าต้องการ -->
        <!--
        <a class="button" style="background: linear-gradient(135deg, #06c755, #05a546); border-left: 5px solid #05a546;" href="#" target="_blank">
            <i class="fas fa-gift"></i>
            <span class="button-text">รับของรางวัลฟรี</span>
        </a>
        -->
    </div>
    
    <p class="footer-text">กดติดตามเพื่อรับข่าวสารใหม่ๆ</p>
</div>

<script>
    // เพิ่มเอฟเฟกต์เมื่อโหลดหน้าเว็บ
    document.addEventListener('DOMContentLoaded', function() {
        const card = document.querySelector('.card');
        card.style.opacity = '0';
        card.style.transform = 'translateY(20px)';
        
        setTimeout(() => {
            card.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
            card.style.opacity = '1';
            card.style.transform = 'translateY(0)';
        }, 100);
        
        // เพิ่มเอฟเฟกต์เมื่อคลิกปุ่ม
        const buttons = document.querySelectorAll('.button');
        buttons.forEach(button => {
            button.addEventListener('click', function(e) {
                // สร้างเอฟเฟกต์คลื่นเมื่อคลิก
                const ripple = document.createElement('span');
                const rect = this.getBoundingClientRect();
                const size = Math.max(rect.width, rect.height);
                const x = e.clientX - rect.left - size / 2;
                const y = e.clientY - rect.top - size / 2;
                
                ripple.style.cssText = `
                    position: absolute;
                    border-radius: 50%;
                    background: rgba(255, 255, 255, 0.6);
                    transform: scale(0);
                    animation: ripple 0.6s linear;
                    width: ${size}px;
                    height: ${size}px;
                    top: ${y}px;
                    left: ${x}px;
                `;
                
                this.appendChild(ripple);
                
                // สำหรับปุ่มโปรเสริม ให้เพิ่มเอฟเฟกต์พิเศษ
                if (this.classList.contains('premium')) {
                    const sparkles = document.createElement('div');
                    sparkles.innerHTML = `
                        <div style="position: absolute; top: 10px; left: 30px; animation: sparkle 0.5s linear;">✨</div>
                        <div style="position: absolute; top: 5px; right: 40px; animation: sparkle 0.5s linear 0.1s;">⭐</div>
                        <div style="position: absolute; bottom: 10px; left: 40px; animation: sparkle 0.5s linear 0.2s;">🌟</div>
                    `;
                    this.appendChild(sparkles);
                    
                    setTimeout(() => {
                        sparkles.remove();
                    }, 600);
                }
                
                // ลบเอฟเฟกต์หลังจาก animation เสร็จ
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
        
        // เอฟเฟกต์พิเศษสำหรับไอคอนโปรเสริม
        const premiumIcon = document.querySelector('.icon-premium');
        premiumIcon.addEventListener('mouseover', function() {
            const spark = document.createElement('div');
            spark.style.position = 'absolute';
            spark.style.top = '50%';
            spark.style.left = '50%';
            spark.style.transform = 'translate(-50%, -50%)';
            spark.style.fontSize = '20px';
            spark.style.opacity = '0';
            spark.style.animation = 'sparkle 0.8s linear';
            spark.innerHTML = '✨';
            this.appendChild(spark);
            
            setTimeout(() => {
                spark.remove();
            }, 800);
        });
    });
    
    // เพิ่ม CSS สำหรับ ripple effect และ sparkle
    const style = document.createElement('style');
    style.textContent = `
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        
        @keyframes sparkle {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }
    `;
    document.head.appendChild(style);
</script>

</body>
</html>
